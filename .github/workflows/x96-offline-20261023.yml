name: X96 Offline Translator APK
on:
  push:
    branches: [x96-offline-translate-build-20261023]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle --no-daemon assembleDebug
        working-directory: x96-translate
      - uses: actions/upload-artifact@v4
        with:
          name: X96-Offline-Translate-APK
          path: x96-translate/app/build/outputs/apk/debug/app-debug.apk
