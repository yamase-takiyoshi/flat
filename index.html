function switchSheet(i){if(state.sheet===i)return;state.sheet=i;state.query='';$('search').value='';renderTabs();renderSide();renderDetail();if(state.view==='map'){renderMap(true)}else renderOutline();$('canvasTitle').textContent=sheets[i].name;hidePanels()}
function hidePanels(){if(innerWidth<=950){$('sidebar').classList.remove('show');$('detail').classList.remove('show');$('shade').classList.remove('show')}}
function renderSide(){let q=state.query.trim().toLocaleLowerCase();const el=$('sideList');el.innerHTML='';$('sideTitle').textContent=q?'検索結果':'分野別の目次';const nodes=q?Array.from(currMap().values()).filter(n=>(n.title+'\n'+n.note+'\n'+n.labels.join(' ')).toLocaleLowerCase().includes(q)):root().children;
$('sideCount').textContent=nodes.length+'件';$('resultCount').textContent=q?`${nodes.length}件ヒット`:'';if(!nodes.length){el.innerHTML='<div class="side-note">該当項目はありません。別のキーワードをお試しください。</div>';return}
nodes.forEach(n=>{let b=document.createElement('button');b.type='button';b.className='side-item'+(n.id===state.selected[state.sheet]?' active':'');b.style.setProperty('--c',colors[(n.branch<0?0:n.branch)%colors.length]);b.innerHTML=`<span class="side-dot"></span><span style="min-width:0"><span class="side-title">${escapeHTML(n.title)}</span><span class="side-desc">${q?'第'+n.depth+'階層':(n.total-1)+'項目を収録'}</span></span>`;b.onclick=()=>focusId(n.id,true);el.appendChild(b)});
if(!q){const notice=document.createElement('p');notice.className='side-note';notice.innerHTML='本データは公開資料に基づく調査記録です。<b>「確定」「分析」「要再確認」</b>などの区分と原典を、各項目の詳細で確認できます。';el.appendChild(notice)}}
function htmlLinkify(text){let s=String(text);let parts=s.split(/(https?:\/\/[^\s<>"']+)/g);return parts.map(v=>/^https?:\/\//.test(v)?'<a href="'+escapeHTML(v)+'" target="_blank" rel="noopener noreferrer">'+escapeHTML(v)+'</a>':escapeHTML(v)).join('')}
function renderDetail(){const n=selected(),el=$('detailScroll');const path=n.ancestors.map(id=>currMap().get(id)?.title).filter(Boolean);let notes=(n.note||'').split('\n').map(line=>{if(!line.trim())return '<div style="height:7px"></div>';if(/^https?:\/\//.test(line.trim()))return '<div class="url">'+htmlLinkify(line)+'</div>';return '<div class="para" style="margin:0">'+htmlLinkify(line)+'</div>'}).join('');if(!notes)notes='<span style="color:#93a0b2">この項目に補足ノートはありません。タイトルと関連分野を参照してください。</span>';
const labels=n.labels.map(l=>'<span class="flag'+(/要|分析|仮説|未/.test(l)?' warn':'')+'">'+escapeHTML(l)+'</span>').join('');
let href=n.href&&/^https?:\/\//.test(n.href)?`<div class="detail-section"><h3>関連リンク</h3><a href="${escapeHTML(n.href)}" target="_blank" rel="noopener noreferrer">参照元のページを開く ↗</a></div>`:'';
el.innerHTML=`<div class="detail-brow"><span class="pill">${escapeHTML(sheets[state.sheet].name)}</span><span>第${n.depth}階層</span></div><h2 class="detail-title">${escapeHTML(n.title)}</h2>${labels?'<div class="detail-labels">'+labels+'</div>':''}<div class="detail-stat"><div class="statbox"><strong>${n.total-1}</strong><span>この項目以下の子孫項目</span></div><div class="statbox"><strong>${n.children.length}</strong><span>直下の項目</span></div></div><div class="detail-section"><h3>調査ノート・原典</h3><div class="detail-note">${notes}</div></div>${href}<div class="detail-section"><h3>階層</h3><div class="path">${[...path,n.title].map(escapeHTML).join('　›　')}</div></div><div class="detail-hint">基準日：2026年10月31日。資料中の金額・人数・役職・営業時間などは、原典に記載された時点の情報です。最新情報はリンク先で再確認してください。</div>`;
}
function selectId(id,panel=true){state.selected[state.sheet]=id;renderDetail();renderSide();document.querySelectorAll('.mapnode').forEach(el=>el.classList.toggle('active',el.dataset.id===id));document.querySelectorAll('.tree-row').forEach(el=>el.classList.toggle('active',el.dataset.id===id));if(panel&&innerWidth<=950){$('detail').classList.add('show');if(innerWidth<=700)$('shade').classList.add('show');$('detailScroll').scrollTop=0}}
function focusId(id,panel){const n=currMap().get(id);if(!n)return;if(state.view==='map'){for(let a of n.ancestors)state.expanded[state.sheet].add(a);renderMap(false);selectId(id,panel);const p=state.layout.find(p=>p.n.id===id);if(p){const z=Math.max(.7,Math.min(state.scale||1,1.25));state.scale=z;state.tx=$('viewport').clientWidth/2-(p.x-state.minX)*z;state.ty=$('viewport').clientHeight/2-(p.y-state.minY)*z;applyTransform()}}else{selectId(id,panel);let row=document.querySelector('.tree-row[data-id="'+id+'"]');if(row){let ancestor=row.closest('.tree-li').parentElement;while(ancestor&&ancestor.classList){ancestor.classList.remove('hidden');ancestor=ancestor.parentElement&&ancestor.parentElement.closest('.treeul')}row.scrollIntoView({block:'center',behavior:'smooth'})}}}
function setExpansion(level){const s=state.expanded[state.sheet];s.clear();const walk=(n)=>{if(n.depth<level&&hasChildren(n))s.add(n.id);n.children.forEach(walk)};walk(root());if(state.view==='map')renderMap(true);else renderOutline();notify(level===1?'大項目だけを表示':level>9?'すべての枝を展開':'第'+level+'階層まで展開')}
function toggleBranch(id){const ex=state.expanded[state.sheet];ex.has(id)?ex.delete(id):ex.add(id);renderMap(false);renderSide();renderDetail()}
function nodeH(n){if(n.depth===0)return 91;const w=n.depth===1?232:272;let per=Math.max(11,Math.floor((w-32)/14.2));let weighted=Array.from(n.title).reduce((v,c)=>v+(/[\x00-\x7F]/.test(c)?0.55:1),0);let lines=Math.min(3,Math.ceil(weighted/per));return Math.max(n.depth===1?60:54,29+lines*18+(hasChildren(n)?5:0))}
function layout(){const r=root();const gapSibling=14,gapFirst=28;let placed=[];
const dims=n=>({w:n.depth===0?304:n.depth===1?232:272,h:nodeH(n)});
const calc=n=>{n._h=nodeH(n);let kids=visibleChildren(n);let sum=kids.reduce((s,ch)=>s+calc(ch),0)+Math.max(0,kids.length-1)*gapSibling;return n._span=Math.max(n._h+18,sum)};
const assign=(n,depth,x,y,side)=>{let {w,h}=dims(n);placed.push({n,depth,x,y,w,h,side});let kids=visibleChildren(n),sum=kids.reduce((s,ch)=>s+ch._span,0)+Math.max(0,kids.length-1)*gapSibling;let top=y-sum/2;for(let ch of kids){let cy=top+ch._span/2;assign(ch,depth+1,side*(depth===0?416:416+depth*348),cy,side);top+=ch._span+gapSibling}};
calc(r);placed.push({n:r,depth:0,x:0,y:0,w:304,h:91,side:0});const all=r.children,split=Math.ceil(all.length/2);
for(const [side,arr] of [[1,all.slice(0,split)],[-1,all.slice(split)]]){let total=arr.reduce((s,n)=>s+n._span,0)+Math.max(0,arr.length-1)*gapFirst;let top=-total/2;for(let n of arr){let y=top+n._span/2;assign(n,1,416*side,y,side);top+=n._span+gapFirst}}
let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;for(let p of placed){minX=Math.min(minX,p.x-p.w/2-30);maxX=Math.max(maxX,p.x+p.w/2+30);minY=Math.min(minY,p.y-p.h/2-28);maxY=Math.max(maxY,p.y+p.h/2+28)}return{placed,minX,minY,maxX,maxY,W:Math.ceil(maxX-minX),H:Math.ceil(maxY-minY)}}
function renderMap(shouldFit){const prev=state.layout.length>0?{sx:state.scale,tx:state.tx,ty:state.ty,minX:state.minX,minY:state.minY}:null;const o=layout();state.layout=o.placed;state.minX=o.minX;state.minY=o.minY;state.worldW=o.W;state.worldH=o.H;const world=$('world');world.innerHTML='';world.style.width=o.W+'px';world.style.height=o.H+'px';
const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('width',o.W);svg.setAttribute('height',o.H);svg.setAttribute('viewBox','0 0 '+o.W+' '+o.H);svg.classList.add('lines');const pos=new Map(o.placed.map(p=>[p.n.id,p]));for(let p of o.placed){if(!p.n.parent)continue;const par=pos.get(p.n.parent.id);if(!par)continue;let side=p.side;let x1=par.x+side*par.w/2-o.minX,y1=par.y-o.minY,x2=p.x-side*p.w/2-o.minX,y2=p.y-o.minY;let dist=Math.abs(x2-x1);let cp=side*Math.max(45,dist*.53);let path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M ${x1.toFixed(1)} ${y1.toFixed(1)} C ${(x1+cp).toFixed(1)} ${y1.toFixed(1)}, ${(x2-cp).toFixed(1)} ${y2.toFixed(1)}, ${x2.toFixed(1)} ${y2.toFixed(1)}`);path.setAttribute('fill','none');path.setAttribute('stroke',colors[(p.n.branch<0?0:p.n.branch)%colors.length]);path.setAttribute('stroke-opacity','.55');path.setAttribute('stroke-width',p.n.depth===1?'2.7':'2');svg.appendChild(path)}world.appendChild(svg);
const fragment=document.createDocumentFragment();let q=state.query.trim().toLocaleLowerCase();for(let p of o.placed){let n=p.n;let div=document.createElement('div');let color=colors[(n.branch<0?0:n.branch)%colors.length];div.className='mapnode'+(n.depth===0?' root':'')+(n.id===state.selected[state.sheet]?' active':'')+(q&&(n.title+'\n'+n.note).toLocaleLowerCase().includes(q)?' searchhit':'');div.style.setProperty('--branch',color);div.style.left=(p.x-o.minX)+'px';div.style.top=(p.y-o.minY)+'px';div.style.width=p.w+'px';div.style.height=p.h+'px';div.dataset.id=n.id;div.title=n.title;let meta=n.depth===0?'2026.10.31 · '+currMap().size+'項目':hasChildren(n)?n.children.length+'件の下位項目':'';div.innerHTML=`<div class="node-inner"><div class="node-title">${escapeHTML(n.title)}</div>${meta?'<div class="node-meta">'+escapeHTML(meta)+'</div>':''}</div>${hasChildren(n)&&n.depth!==0?'<button type="button" class="twisty" title="枝を開閉" aria-label="枝を開閉">'+(state.expanded[state.sheet].has(n.id)?'−':'+')+'</button>':''}`;
div.onclick=e=>{if(e.target.closest('.twisty')){e.stopPropagation();toggleBranch(n.id);return}selectId(n.id,true)};div.ondblclick=()=>{if(hasChildren(n)&&n.depth!==0)toggleBranch(n.id)};fragment.appendChild(div)}world.appendChild(fragment);
$('nodeCount').textContent=o.placed.length+' / '+currMap().size+' 項目を表示';$('canvasTitle').textContent=sheets[state.sheet].name;
if(shouldFit||!state.isReady){fit();state.isReady=true}else if(prev){state.scale=prev.sx;state.tx=prev.tx+(o.minX-prev.minX)*prev.sx;state.ty=prev.ty+(o.minY-prev.minY)*prev.sx;applyTransform()}}
function applyTransform(){let world=$('world');world.style.transform=`translate(${state.tx}px,${state.ty}px) scale(${state.scale})`;$('zoomReadout').textContent=Math.round(state.scale*100)+'%'}
function fit(){let v=$('viewport');if(!v.clientWidth||!v.clientHeight)return;const pad=55;let s=Math.min((v.clientWidth-pad)/state.worldW,(v.clientHeight-pad)/state.worldH,1.4);state.scale=Math.max(.05,s);state.tx=(v.clientWidth-state.worldW*state.scale)/2;state.ty=(v.clientHeight-state.worldH*state.scale)/2;applyTransform()}
function zoomAt(factor,cx,cy){let v=$('viewport');let ox=cx??v.clientWidth/2,oy=cy??v.clientHeight/2;let z=Math.max(.055,Math.min(2.8,state.scale*factor));state.tx=ox-(ox-state.tx)*z/state.scale;state.ty=oy-(oy-state.ty)*z/state.scale;state.scale=z;applyTransform()}
function renderOutline(){
 const area=$('outline');area.innerHTML='';let h=document.createElement('div');h.className='outline-inner';
 const q=state.query.trim().toLocaleLowerCase();
 h.innerHTML=`<div class="outline-header"><h2>${escapeHTML(sheets[state.sheet].name)}</h2><p>${q?'検索結果をタップすると、その項目の詳細と出典を開けます。':'枝の「＋」を押すと下位項目を表示します。文字をタップすると調査ノートと出典が開きます。'}</p></div>`;
 if(q){
   const matches=Array.from(currMap().values()).filter(n=>(n.title+'\n'+n.note+'\n'+n.labels.join(' ')+'\n'+n.href).toLocaleLowerCase().includes(q));
   let info=document.createElement('p');info.className='result-count-line';info.textContent=matches.length+'件の一致';info.style.cssText='font-size:12px;color:#62738d;margin:0 4px 12px';h.appendChild(info);
   let list=document.createElement('div');list.className='result-list';
   if(!matches.length){let p=document.createElement('div');p.className='side-note';p.textContent='一致する項目はありません。検索語を変更してください。';list.appendChild(p)}
   matches.forEach(n=>{let b=document.createElement('button');b.className='result-item';b.type='button';let path=n.ancestors.map(id=>currMap().get(id)?.title).filter(Boolean).slice(1);let snippet=(n.note||'').replace(/\s+/g,' ').slice(0,125);
     b.innerHTML='<strong>'+escapeHTML(n.title)+'</strong><small>'+escapeHTML(path.join(' › ')||'中心トピック')+'</small>'+(snippet?'<p>'+escapeHTML(snippet)+'</p>':'');
     b.onclick=()=>selectId(n.id,true);list.appendChild(b)});
   h.appendChild(list);area.appendChild(h);return;
 }
 function makeList(nodes){let ul=document.createElement('ul');ul.className='treeul';nodes.forEach(n=>{
   let li=document.createElement('li');li.className='tree-li'+(n.depth===0?' tree-root':'');
   let row=document.createElement('div');row.className='tree-row'+(n.id===state.selected[state.sheet]?' active':'');row.dataset.id=n.id;
   let sub;let toggle=document.createElement('button');toggle.className='tree-open'+(!hasChildren(n)?' empty':'');toggle.type='button';
   let expanded=n.depth===0||state.expanded[state.sheet].has(n.id);
   toggle.textContent=hasChildren(n)?(expanded?'−':'+'):'•';toggle.setAttribute('aria-label',expanded?'枝を閉じる':'枝を開く');
   toggle.onclick=()=>{if(sub){let hidden=sub.classList.toggle('hidden');toggle.textContent=hidden?'+':'−';toggle.setAttribute('aria-label',hidden?'枝を開く':'枝を閉じる');hidden?state.expanded[state.sheet].delete(n.id):state.expanded[state.sheet].add(n.id)}};
   let btn=document.createElement('button');btn.className='tree-select';btn.type='button';btn.textContent=n.title;btn.onclick=()=>selectId(n.id,true);
   let mini=document.createElement('span');mini.className='tree-mini';mini.textContent=hasChildren(n)?(n.total-1)+'件':'';
   row.append(toggle,btn,mini);li.appendChild(row);
   if(hasChildren(n)){sub=makeList(n.children);if(!expanded)sub.classList.add('hidden');li.appendChild(sub)}ul.appendChild(li)
 });return ul}
 h.appendChild(makeList([root()]));area.appendChild(h)
}
function setView(mode){state.view=mode;$('viewport').style.display=mode==='map'?'block':'none';$('canvasTop').style.display=mode==='map'?'flex':'none';$('zoom').style.display=mode==='map'?'flex':'none';$('outline').classList.toggle('on',mode==='outline');$('mapBtn').classList.toggle('selected',mode==='map');$('outlineBtn').classList.toggle('selected',mode==='outline');if(mode==='outline')renderOutline();else {renderMap(true)}}
$('sidebarBtn').onclick=()=>{$('sidebar').classList.toggle('show')};$('closeDetail').onclick=hidePanels;$('shade').onclick=hidePanels;$('mapBtn').onclick=()=>setView('map');$('outlineBtn').onclick=()=>setView('outline');$('collapseBtn').onclick=()=>setExpansion(1);$('level2Btn').onclick=()=>setExpansion(2);$('expandBtn').onclick=()=>setExpansion(99);$('fitBtn').onclick=()=>state.view==='map'?fit():$('outline').scrollTo({top:0,behavior:'smooth'});$('zoomFit').onclick=fit;$('zoomIn').onclick=()=>zoomAt(1.25);$('zoomOut').onclick=()=>zoomAt(.8);$('printBtn').onclick=()=>{if(state.view!=='outline')renderOutline();window.print()};
$('search').addEventListener('input',e=>{state.query=e.target.value.trim();renderSide();if(state.view==='map')renderMap(false);else renderOutline()});$('search').addEventListener('keydown',e=>{if(e.key==='Enter'&&state.query){let match=Array.from(currMap().values()).find(n=>(n.title+' '+n.note).toLocaleLowerCase().includes(state.query.toLocaleLowerCase()));if(match)focusId(match.id,true)}});
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('search').focus();$('search').select()}else if(e.key==='Escape'){if(document.activeElement===$('search')){$('search').value='';state.query='';renderSide();if(state.view==='map')renderMap(false);$('search').blur()}hidePanels()}else if((e.key==='+'||e.key==='=')&&document.activeElement.tagName!=='INPUT')zoomAt(1.2);else if(e.key==='-'&&document.activeElement.tagName!=='INPUT')zoomAt(.83)});
const v=$('viewport');let pointers=new Map(),dragState=null,pinchDistance=0;
function localPoint(e){let r=v.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
v.addEventListener('pointerdown',e=>{if(e.target.closest('.mapnode'))return;v.setPointerCapture(e.pointerId);pointers.set(e.pointerId,localPoint(e));if(pointers.size===1){dragState={start:localPoint(e),tx:state.tx,ty:state.ty};v.classList.add('dragging')}if(pointers.size===2){let a=[...pointers.values()];pinchDistance=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);dragState=null}});
v.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,localPoint(e));if(pointers.size===1&&dragState){let p=localPoint(e);state.tx=dragState.tx+p.x-dragState.start.x;state.ty=dragState.ty+p.y-dragState.start.y;applyTransform()}else if(pointers.size===2){let a=[...pointers.values()];let dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);let mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;if(pinchDistance>0&&dist>0)zoomAt(dist/pinchDistance,mx,my);pinchDistance=dist}});
function endPointer(e){pointers.delete(e.pointerId);if(!pointers.size){dragState=null;pinchDistance=0;v.classList.remove('dragging')}else if(pointers.size===1){dragState={start:[...pointers.values()][0],tx:state.tx,ty:state.ty};pinchDistance=0}}v.addEventListener('pointerup',endPointer);v.addEventListener('pointercancel',endPointer);
v.addEventListener('wheel',e=>{e.preventDefault();let p=localPoint(e);zoomAt(Math.exp(-e.deltaY*.0012),p.x,p.y)},{passive:false});
window.addEventListener('resize',()=>{if(state.view==='map'&&state.isReady)fit()});
renderTabs();renderSide();renderDetail();if(innerWidth<=700){setView('outline')}else{renderMap(true)};
})();
</script>
